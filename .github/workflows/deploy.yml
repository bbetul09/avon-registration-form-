name: Deploy Avon to Güzel Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avon-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare and lint website files
        shell: bash
        run: |
          staging="$RUNNER_TEMP/avon-site"
          mkdir -p "$staging"
          git ls-files -z -- ':(top,glob)*.php' ':(top,glob)admin/*.php' assets/ \
            ':(exclude)db.php' ':(exclude)config.php' ':(exclude)setup.php' ':(exclude)blog-seed.php' \
            | tar --null -T - -cf - \
            | tar -xf - -C "$staging"
          find "$staging" -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l

      - name: Upload website
        id: ftp_upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with: &ftp_settings
          server: ${{ vars.AVON_FTP_PROTOCOL == 'ftp' && '104.247.165.210' || 'mt-rohan.guzelhosting.com' }}
          username: ${{ secrets.AVON_FTP_USERNAME }}
          password: ${{ secrets.AVON_FTP_PASSWORD }}
          protocol: ${{ vars.AVON_FTP_PROTOCOL || 'ftps' }}
          port: 21
          local-dir: ${{ runner.temp }}/avon-site/
          server-dir: ./
          state-name: .ftp-deploy-avon-state.json
          security: strict
          timeout: 60000

      - name: Retry website upload
        if: steps.ftp_upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with: *ftp_settings
